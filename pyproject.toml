[project]
name = "spark-vector-pyspark-example"
version = "0.1.0"
description = "PySpark example accelerated by spark-vector, the JVM SIMD execution engine for Spark SQL"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    # spark-vector 0.0.1 targets Spark 4.1.x / Scala 2.13 only.
    "pyspark==4.1.3",
]

[project.urls]
"spark-vector" = "https://github.com/spark-vector/spark-vector"

[tool.uv]
package = false
